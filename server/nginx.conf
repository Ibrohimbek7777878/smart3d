# Smart3D — nginx NAMUNASI (TZ-36 P5). Faqat repo fayli: serverda uni admin qo'lda joylaydi (masalan
# /etc/nginx/conf.d/smart3d.conf — http{} ichida include qilinadi) va `nginx -t` bilan tekshiradi. Repo serverga hech narsa yozmaydi.
#
# QOIDA: nginx hamma narsani Smart3D serveriga (Node, bitta jarayon) uzatadi. try_files / "hamma yo'l app.html" YO'Q.
# Sabab: server o'zi biladi (server/routes/sahifalar.js, himoya.js):
#   * ilova manzillari /kirish /royxat /loyihalar /loyiha/yangi /loyiha/<raqam> /sozlamalar /sozlamalar/narxlar
#     /buyurtmalar /tg  ->  web/dist/app.html. Qolgan har qanday yo'l -> 404 (hamma narsani app.html ga burish yo'q);
#   * har sahifaga o'z CSP / HSTS / X-Frame-Options / nosniff sarlavhasi (ilova sahifalari Telegram ramkasiga ochiq);
#   * kesh: /assets/* — 1 yil immutable; *.html, /sw.js, /registerSW.js, *.webmanifest, /data/*.json — no-cache.
# Shuning uchun bu fayl sarlavhalarni TAKRORLAMAYDI (CSP ikki marta bo'lib qolmasin) va statik fayllarni o'zi bermaydi.
#
# Kerak: Node serveri 127.0.0.1:3070 da (PORT=3070, TRUST_PROXY=1 — DEPLOY.md §3). Port va domenni admin almashtiradi.

upstream smart3d_app {
    server 127.0.0.1:3070;
    keepalive 16;
}

# Serverda ham /api uchun 300/daq/IP chegara bor; bu — kirish (parol/SMS/Google/ro'yxat) uchun qo'shimcha, qattiqroq chegara.
limit_req_zone $binary_remote_addr zone=s3d_auth:10m rate=20r/m;

# WebSocket yangilanishi uchun
map $http_upgrade $s3d_conn_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name smart3d.bittada.uz;
    # HTTPS: `certbot --nginx -d smart3d.bittada.uz` shu blokni o'zi 443 ga o'tkazadi
    # (sayt PWA, kamera va mikrofon uchun HTTPS shart; cookie `Secure`).

    client_max_body_size 3m;          # loyiha hujjati: server chegarasi 2 MB (express.json)

    gzip on;                          # Node siqmaydi — shu yerda
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/manifest+json model/gltf+json;

    # Umumiy proxy sozlamalari. DIQQAT: location ichida o'z proxy_set_header bo'lsa, bular o'sha location'ga meros bo'lmaydi —
    # shuning uchun /ws va /api/telegram/fayl da qayta yozilgan.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;                      # server cookie bilan kelgan so'rovni Host bo'yicha tekshiradi (CSRF)
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for; # rate limit haqiqiy IP bo'yicha ishlashi uchun
    proxy_set_header X-Forwarded-Proto $scheme;                    # Secure cookie va HSTS uchun
    proxy_read_timeout 60s;

    # WebSocket: narx yangilanishi. Origin va 5 ulanish/IP chegarasini server o'zi tekshiradi.
    location /ws {
        proxy_pass http://smart3d_app;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $s3d_conn_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Kirish — qo'shimcha chegara
    location ^~ /api/auth/   { limit_req zone=s3d_auth burst=10 nodelay; proxy_pass http://smart3d_app; }
    location = /api/login    { limit_req zone=s3d_auth burst=10 nodelay; proxy_pass http://smart3d_app; }
    location = /api/register { limit_req zone=s3d_auth burst=10 nodelay; proxy_pass http://smart3d_app; }

    # Telegram: fayl botga yuboriladi (10 MB, base64 ~ 14 MB) — shu yo'lga katta chegara
    location = /api/telegram/fayl {
        client_max_body_size 15m;
        proxy_pass http://smart3d_app;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mahsulot rasmlari (/data/rasm/<id>.webp): nom = id, mazmun o'zgarmaydi -> uzoq immutable kesh.
    # Rasmni almashtirsangiz — YANGI nom bering (eski nom brauzerda 30 kungacha turadi).
    # Faqat Cache-Control almashadi; CSP / nosniff serverdan o'zgarishsiz keladi.
    location ^~ /data/rasm/ {
        proxy_pass http://smart3d_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Service worker va ilova sahifasi — HECH QACHON keshlanmasin (aks holda eski versiya qotib qoladi).
    # Server o'zi `no-cache` beradi; nginx proxy_cache ishlatmaydi, shuning uchun uzatiladi, o'zgartirilmaydi.
    location = /sw.js    { proxy_pass http://smart3d_app; }
    location = /app.html { proxy_pass http://smart3d_app; }

    # /assets/* (xesh nomli fayllar; server `public, max-age=31536000, immutable` beradi), /, ilova manzillari,
    # /api/*, /eski/, noma'lum yo'l (server 404 beradi) — hammasi serverga.
    location / {
        proxy_pass http://smart3d_app;
    }
}
